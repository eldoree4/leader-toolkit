name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=leader_toolkit .
          fi
          find android -name AndroidManifest.xml -type f \
            -exec sed -i '/android.permission.INTERNET/d' {} +

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests when present
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found; skipping."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: leader-toolkit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

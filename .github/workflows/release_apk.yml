name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=leader_toolkit .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests when present
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found; skipping."
          fi

      - name: Check required build variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing Actions variable SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY (or legacy SUPABASE_ANON_KEY)" && exit 1)
          test -n "$API_BASE_URL" || (echo "Missing Actions variable API_BASE_URL" && exit 1)

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: leader-toolkit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
